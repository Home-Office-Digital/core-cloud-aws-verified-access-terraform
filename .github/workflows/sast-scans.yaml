name: Checkov and SonarQube Scan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'modules/**'
  push:
    branches:
      - main
    paths:
      - 'modules/**'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write
  pull-requests: read

jobs:
  checkov_scan:
    uses: UKHomeOffice/core-cloud-workflow-checkov-sast-scan/.github/workflows/checkov-scan-base.yaml@b7a62a0b5f4dae8c50166d822b301109b76439da
    with:
      path: '.'
  sonarqube-scan:
    name: Run SonarQube Scan
    uses: Home-Office-Digital/core-cloud-workflow-sonarqube-scan/.github/workflows/sonarqube-scan.yaml@794e2f05552d489d6ceb7751b86baf4c57ff0058
    secrets:
      sonar_token: ${{ secrets.sonar_token }}
      sonar_host_url: ${{ secrets.sonar_host_url }}